# Every push and pull request: the CLI self-check passes and the parts file matches ui/.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CLI self-check
        run: node cli/test.mjs
      - name: Parts file is up to date
        run: |
          node scripts/build-registry.mjs
          git diff --exit-code public/r || (echo "Run: npm run registry" && exit 1)
