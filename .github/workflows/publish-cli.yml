# Publish the `amnt` CLI to npm with a provenance badge ("built from this repo").
# Release: bump cli/package.json, then `git tag cli-v0.1.1 && git push --tags`.
# One-time setup on npmjs.com → amnt-ui → Settings → Trusted Publisher:
# GitHub, amntio/amnt-ui, workflow publish-cli.yml. No token needed.
name: Publish amnt CLI
on:
  push:
    tags: ["cli-v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node cli/test.mjs
      - run: npm publish --provenance --access public
        working-directory: cli
